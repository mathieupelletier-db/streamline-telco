command:
  - "python"
  - "-m"
  - "uvicorn"
  - "app:app"
  - "--host"
  - "0.0.0.0"
  - "--port"
  - "8000"

env:
  # Build against the Build-1 DEV branch (keeping main/production clean to demo from).
  # Explicit PG* vars (Option A: service-principal auth) — the app SP has a Lakebase role on dev.
  - name: ENDPOINT_NAME
    value: "projects/streamline-telco/branches/dev/endpoints/primary"
  - name: PGHOST
    value: "ep-silent-block-e88gklku.database.centralus.azuredatabricks.net"
  - name: PGUSER
    value: "a897c3a6-0fb9-442c-84bf-770e92974ee7"   # app service principal client ID
  - name: PGPORT
    value: "5432"
  - name: PGDATABASE
    value: "databricks_postgres"
  - name: PGSSLMODE
    value: "require"
  - name: SERVING_ENDPOINT
    value: "databricks-claude-sonnet-4-5"
  - name: APP_USER_EMAIL
    value: "rae.nakamura@streamline.example"

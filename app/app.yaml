# Databricks App manifest — Streamline Care Desk (deployed against the Build-1 DEV branch).
#
# Explicit-env variant (no valueFrom bindings): the Autoscaling Lakebase project isn't attachable
# as a `postgres` app resource, so PG* + LAKEBASE_ENDPOINT are set directly and the app SP
# (a897c3a6-…) authenticates to the dev branch via its Lakebase Postgres role.
#
# Lifecycle: `npm install` (proxy) → `npm run build` (no-op; dist/ ships via sync) → command below.

command: ['node', '--env-file-if-exists=.env', 'dist/server.js']

user_authorization:
  scopes:
    - model-serving      # OpenAI Agents loop → serving-endpoints chat/completions
    - genie              # ask_data → Genie space
    - sql                # warehouse-backed analytics queries
    - postgres           # Lakebase pool
    - catalog.catalogs:read
    - catalog.schemas:read
    - catalog.tables:read

env:
  - name: NODE_ENV
    value: production

  # ── Lakebase (DEV branch) — explicit; SP has a Postgres role on this branch ──
  - name: LAKEBASE_ENDPOINT
    value: 'projects/streamline-telco/branches/dev/endpoints/primary'
  - name: PGHOST
    value: 'ep-silent-block-e88gklku.database.centralus.azuredatabricks.net'
  - name: PGUSER
    value: 'a897c3a6-0fb9-442c-84bf-770e92974ee7'
  - name: PGPORT
    value: '5432'
  - name: PGDATABASE
    value: 'databricks_postgres'
  - name: PGSSLMODE
    value: 'require'

  # ── Warehouse (analytics plugin) ──
  - name: DATABRICKS_WAREHOUSE_ID
    value: 'e921c86338f3e272'
  - name: WAREHOUSE_ID
    value: 'e921c86338f3e272'

  # ── App config (plain values normally injected by finalize_app.sh) ──
  - name: DEMO_CATALOG
    value: 'ai_demo_gen'
  - name: DEMO_SCHEMA
    value: 'streamline_telco'
  - name: GENIE_SPACE_ID
    value: '01f1a22b61531adeb4bfa89a5193ef65'
  - name: AGENT_MODEL
    value: 'databricks-claude-sonnet-4-5'
